
# Dota 2 Socket Scanner - GitHub Actions Workflow
# Conservative hourly scanning schedule

name: Dota 2 Socket Scanner

on:
  # Run once every hour
  schedule:
    - cron: "0 * * * *"

  # Allow manual triggering
  workflow_dispatch:

# Prevent overlapping scanner runs
concurrency:
  group: steam-market-scanner
  cancel-in-progress: false

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.11"

jobs:
  scan:
    name: Scan Steam Market
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}

    steps:
      # Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up Python
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      # Install dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      # Run database migrations
      - name: Run database migrations
        env:
          PGPASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          pip install psycopg2-binary
          alembic upgrade head

      # Run scanner with Telegram notifications
      - name: Run socket scanner
        env:
          STEAM_WEBAPI_KEY: ${{ secrets.STEAM_WEBAPI_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_ACTIONS: "true"
        run: |
          python -m src.main

      # Cleanup old data
      - name: Cleanup old data
        if: success()
        run: |
          python scripts/cleanup_old_data.py

      # Upload logs if scanner fails
      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scanner-logs
          path: logs/
          retention-days: 7
          if-no-files-found: ignore

  lint:
    name: Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dev dependencies
        run: |
          pip install -r requirements.txt
          pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

      - name: Run mypy
        run: mypy src
